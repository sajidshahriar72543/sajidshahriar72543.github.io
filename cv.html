<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sajid | CV</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Times New Roman", Times, serif !important;
        }

        body {
            background: #4a4a4a;
            color: #f2f2f2;
            height: 100vh;
            overflow: hidden;
        }

        .navbar {
            height: 72px;
            border-bottom: 1px solid #777;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            background: #4a4a4a;
            z-index: 1000;
        }

        .nav-wrapper {
            width: 1400px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        nav {
            display: flex;
            gap: 28px;
        }

        nav a {
            color: #f2f2f2;
            text-decoration: none;
            font-size: 1rem;
        }

        nav a.active {
            border-bottom: 2px solid white;
            padding-bottom: 10px;
            font-weight: 700;
        }

        .pdf-container {
            width: 100%;
            height: calc(100vh - 72px);
        }

        .pdf-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 900px) {

            .nav-wrapper {
                flex-direction: column;
                justify-content: center;
                gap: 12px;
                padding: 12px 20px;
            }

            .navbar {
                height: auto;
                padding: 10px 0;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .pdf-container {
                height: calc(100vh - 110px);
            }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="nav-wrapper">

            <div></div>

            <nav>
                <a href="index.html">Home</a>
                <a href="pub.html">Research</a>
                <a href="#" class="active">CV</a>
            </nav>

        </div>
    </header>

    <div class="pdf-container">
        <iframe src="assets/cv.pdf"></iframe>
    </div>

</body>

</html>
